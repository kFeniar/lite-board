<!-- Every file carries ?v= so an update always reaches the phone.
     Without it a browser keeps its cached data.js indefinitely and a
     participant silently runs last week's questions. Bump the number
     on every upload; the fonts are loaded by app.js. -->
<link rel="stylesheet" href="thko.css?v=5">
</head>
<body>
<div id="app"></div>
<div class="stat" id="stat" hidden></div>
<script src="config.js?v=5"></script>
<script src="data.js?v=5"></script>
<script src="app.js?v=5"></script>
</body>
