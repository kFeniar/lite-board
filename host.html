<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Board Host</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..700,0..100,0..1&amp;family=Archivo:wdth,wght@75..125,400..700&amp;family=Instrument+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<link rel="stylesheet" href="thko.css?v=5">
<style>
/* the host view on the same system as the board */
:root{--ground:#FFFBF8;--shoyu:#0A0A0A;--tamari:#5F5750;--nuka:#E4DCD0;
 --amber:#7A2234;--negi:#7A2234;
 --serif:"Fraunces",Georgia,serif;
 --sans:"Instrument Sans",-apple-system,BlinkMacSystemFont,sans-serif;
 --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
body{font-family:var(--sans);color:var(--shoyu)}
h1,h2{font-family:var(--serif);font-variation-settings:"opsz" 144,"SOFT" 0,"WONK" 1;
 font-weight:700;letter-spacing:-.01em}
h3{font-family:var(--serif);font-variation-settings:"opsz" 44,"SOFT" 0,"WONK" 0;font-weight:700}
</style>
</head>
<body>
<div class="bar"><div class="bar-in wide">
  <span class="who">Host · The Kokumi</span>
  <span class="row">
    <label class="mono" style="cursor:pointer;display:flex;align-items:center;gap:6px">
      <input type="checkbox" id="auto" style="accent-color:var(--tamari)"><span> auto</span></label>
    <button class="ghost sm" id="rf">Refresh</button>
    <button class="sm" id="brief">Export brief</button>
  </span>
</div></div>

<div class="wrap wide" style="padding-top:38px;padding-bottom:80px">
  <div id="head"></div>
  <div class="row" id="nav" style="margin:26px 0 30px"></div>
  <hr style="margin-bottom:34px">
  <div id="body"></div>
</div>

<script src="config.js?v=5"></script>
<script src="data.js?v=5"></script>
<script src="host.js?v=5"></script>
</body>
</html>
